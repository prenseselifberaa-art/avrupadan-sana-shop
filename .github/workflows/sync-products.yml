name: Automated Dolap & Gardrops Sync

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web interface
  push:
    branches:
      - main
    paths:
      - 'scripts/sync-products.js'

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run Dolap & Gardrops Sync
        run: npm run sync-products

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/products.json src/data/products.js
          if git diff --staged --quiet; then
            echo "No changes in listings detected. Everything is up to date."
          else
            git commit -m "chore(sync): automated Dolap & Gardrops listings sync [skip ci]"
            git push origin main
            echo "Successfully synced new listings and pushed to main!"
          fi
